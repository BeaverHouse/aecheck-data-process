# Local test database; this job runs on the host, where its port listens on 127.0.0.1.
env:
- secretKey: GO_ENV
  value: development
- secretKey: POSTGRES_HOST
  value: "127.0.0.1"
- secretKey: POSTGRES_USER
  value: "postgres"
- secretKey: POSTGRES_PASSWORD
  value: "postgres"
- secretKey: POSTGRES_PORT
  value: "54322"
- secretKey: POSTGRES_SSLMODE
  value: disable
